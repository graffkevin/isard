[workspace]
members = ["crates/engine", "crates/geo", "crates/pointcloud", "crates/tiles3d"]
# The fuzz targets (cargo-fuzz, nightly) are a workspace of their own
exclude = ["fuzz"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Rendering code converts between f64 (CPU precision) and f32 (GPU) all the time
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Geometry code: x, y, w, h, a, b read better than long names
many_single_char_names = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
