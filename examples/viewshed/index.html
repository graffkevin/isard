<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewshed · Isard</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <style>
      /* A compact panel: the map stays in view in the docs' frame */
      .panel {
        width: 200px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .panel p {
        margin: 2px 0;
      }
      .panel label:has(input[type="range"]) {
        display: grid;
        grid-template-columns: 1fr auto;
      }
      .panel label:has(input[type="range"]) input {
        grid-column: 1 / -1;
        grid-row: 2;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <h1>Viewshed</h1>
      <p>Seen in green, hidden in red. Drag the pin, or click.</p>
      <p><label>Height <input id="height" type="range" min="1" max="60" step="1" value="2" /> <span id="height-value"></span></label></p>
      <p><label><input id="one-way" type="checkbox" checked /> One way, as a camera</label></p>
      <p><label>Direction <input id="direction" type="range" min="0" max="359" step="1" value="170" /> <span id="direction-value"></span></label></p>
      <p><label>Angle of view <input id="fov" type="range" min="10" max="170" step="5" value="60" /> <span id="fov-value"></span></label></p>
      <p><label>Range <input id="range" type="range" min="200" max="2000" step="50" value="900" /> <span id="range-value"></span></label></p>
    </div>
    <script type="module" src="../dist/viewshed/main.js"></script>
  </body>
</html>
