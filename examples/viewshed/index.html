<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewshed · Isard</title>

  <body>
    <div id="map"></div>
    <div class="panel">
      <h1>Viewshed</h1>
      <p>What can be seen from the observer, in green, and what the hill and the BD TOPO buildings hide, in red. Click

      <p><label>Range <input id="range" type="range" min="200" max="2000" step="50" value="900" /> <span id="range-value"></span></label></p>
    </div>
    <script type="module" src="../dist/viewshed/main.js"></script>
