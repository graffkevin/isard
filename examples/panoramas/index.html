<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panoramas · Isard</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <style>
      .panel {
        width: 220px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .panel p {
        margin: 3px 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <h1>Panoramas</h1>
      <p>Street-level images of Paris (iTowns' sample data) projected onto the BD TOPO buildings.</p>
      <p id="help">Walk in: drag to look around, click the street to go there, Z and S for the next and the previous
        panoramas.</p>
      <p><button id="walk" type="button">Walk in</button> <span id="where"></span></p>
    </div>
    <script type="module" src="../dist/panoramas/main.js"></script>
  </body>
</html>
