<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swipe · Isard</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <style>
      #line {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 2;
        width: 4px;
        margin-left: -2px;
        background: #fff;
        box-shadow: 0 0 6px rgb(0 0 0 / 0.4);
        cursor: ew-resize;
        touch-action: none;
      }
      #line::after {
        content: "⇆";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 6px 8px;
        border-radius: 14px;
        background: #fff;
        font-size: 14px;
      }
      .panel {
        max-width: 230px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="line"></div>
    <div class="panel">
      <h1>Swipe</h1>
      <p>Left of the line, the orthophotos of 1950-1965; right of it, today's. Drag the line.</p>
    </div>
    <script type="module" src="../dist/swipe/main.js"></script>
  </body>
</html>
