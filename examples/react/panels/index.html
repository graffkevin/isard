<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D panels (React) · Isard</title>
    <link rel="stylesheet" href="../../shared/page.css" />
    <style>
      .panel {
        max-width: 240px;
        font-size: 12px;
      }
      .screen {
        width: 480px;
        height: 270px;
        border: 6px solid #1d2433;
        background: #000;
      }
      .screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .sign {
        width: 320px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c7ed6;
        color: #fff;
        font: 600 30px system-ui, sans-serif;
        border: 4px solid #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../dist/react/panels/main.js"></script>
  </body>
</html>
