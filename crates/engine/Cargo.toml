[package]
name = "isard"
version = "0.3.0"
publish = false
edition = "2024"
license = "MIT"
authors = ["Kevin Graff"]
repository = "https://github.com/graffkevin/isard"
description = "A WebGL2 map engine for large, interactive data layers, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1"
geo = { package = "isard-geo", path = "../geo" }
glam = { version = "0.34", features = ["bytemuck"] }
glow = "0.18"
tiles3d = { package = "isard-tiles3d", path = "../tiles3d", optional = true }
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3.106"
features = [
  "Blob",
  "HtmlCanvasElement",
  "ImageBitmap",
  "Request",
  "RequestCache",
  "RequestInit",
  "Response",
  "WebGl2RenderingContext",
  "WebGlContextAttributes",
  "WebGlPowerPreference",
  "ImageBitmapOptions",
  "PremultiplyAlpha",
  "ColorSpaceConversion",
  "Window",
  "WorkerGlobalScope",
  "AbortController",
  "AbortSignal",
  "BlobPropertyBag",
  "console",
  "Performance",
]

[features]
default = ["tiles3d"]
# 3D Tiles layers and the decoding workers' entry points: a third of the module. scripts/build.ts also builds the engine
# without them (isard_core_bg.wasm), which maps load first; this one only once a 3D Tiles layer is added
tiles3d = ["dep:tiles3d"]

[lints]
workspace = true

[dev-dependencies]
# Benchmarks (benches/, criterion): `cargo bench -p isard`; `cargo bench --no-run` only builds them
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "raster"
harness = false
