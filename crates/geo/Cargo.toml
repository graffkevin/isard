[package]
name = "isard-geo"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Camera and projections (Web Mercator, globe), geodesy of the body (WGS 84, the Moon, Mars), the French geoid and tile selection of isard"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
earcut = "0.4"

[lints]
workspace = true

[dev-dependencies]
# Benchmarks (benches/, criterion): `cargo bench -p isard-geo`; `cargo bench --no-run` only builds them
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "geo"
harness = false
