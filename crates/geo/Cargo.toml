[package]
name = "isard-geo"
version = "0.1.1"
publish = false
edition = "2024"
license = "MIT"
description = "Camera and projections (Web Mercator, globe), WGS 84 geodesy, the French geoid and tile selection of isard"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
earcut = "0.4"

[lints]
workspace = true

[dev-dependencies]
# Benchmarks (benches/, criterion): `cargo bench -p isard-geo`; `cargo bench --no-run` only builds them
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "geo"
harness = false
