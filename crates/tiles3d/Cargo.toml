[package]
name = "isard-tiles3d"
version = "1.0.0"
publish = false
edition = "2024"
license = "MIT"
authors = ["Kevin Graff"]
repository = "https://github.com/graffkevin/isard"
description = "3D Tiles tileset tree, traversal and b3dm / glb decoding of isard"

[dependencies]
geo = { package = "isard-geo", path = "../geo" }
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
# Benchmarks (benches/, criterion): `cargo bench -p isard-tiles3d`; `cargo bench --no-run` only builds them
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tiles3d"
harness = false
