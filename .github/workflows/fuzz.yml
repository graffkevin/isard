# Continuous fuzzing of the parsers that read downloaded bytes (3D Tiles glb / b3dm, meshopt streams, tilesets and
# subtrees) and of the polygon triangulation: each target 5 minutes a night (cargo-fuzz, nightly: fuzz/), the corpus
# kept between runs in the cache, crashes uploaded as artifacts.
name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '300'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode, meshopt, tileset, subtree, shapes]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v5
      # The nightly of fuzz/rust-toolchain.toml
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run
        run: |
          mkdir -p "corpus/$TARGET"
          seeds="seeds/$TARGET"
          if [ "$TARGET" = decode ]; then seeds=../crates/tiles3d/tests/data; fi
          [ -d "$seeds" ] || seeds=
          cargo fuzz run "$TARGET" "corpus/$TARGET" $seeds -- -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
