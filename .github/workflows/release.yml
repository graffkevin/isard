# Publishes the package on npm once the checks pass on a push to main, when its version is not on npm yet: raising the
# version (packages/isard/package.json, the crates, a changelog section) and pushing it to main is the release. The
# commit is then tagged v<version> with a GitHub release of its changelog section. With provenance: npm's trusted
# publishing authenticates this workflow (configured once on npmjs.com, in the settings of the package isard: publisher
# GitHub Actions, the repository that publishes, workflow release.yml), no token is stored anywhere
name: Release

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

# Never cancelled: a publication half done is worse than a slow one
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Most pushes do not raise the version: a quick look at npm before building anything
  version:
    # Only the repository that publishes (its variable RELEASE set to true): a mirror runs the checks, not the release
    if: vars.RELEASE == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      new: ${{ steps.npm.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: packages/isard/package.json
      - id: npm
        run: |
          version=$(jq -r .version packages/isard/package.json)
          if npm view "isard@$version" version > /dev/null 2>&1; then new=false; else new=true; fi
          echo "isard $version, new: $new"
          echo "new=$new" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the checks passed on, not the head of main at this time
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - id: versions
        run: echo "wasm-bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm-bindgen }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts --publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
