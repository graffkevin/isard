# Publishes the package on npm when a v<version> tag is pushed (`bun run release`), with provenance: npm's trusted
# publishing authenticates this workflow (configure it once on npmjs.com: organization ign-junn, package
# @ign-junn/isard, repository and workflow release.yml), no token is stored anywhere
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

# Never cancelled: a publication half done is worse than a slow one
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - id: versions
        run: echo "wasm-bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm-bindgen }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts --publish
